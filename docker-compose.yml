services:
  server-a:
    build: ./server-a
    ports:
      - "3000:3000"
    environment:
      SERVER_B_URL: http://server-b:3001
    depends_on:
      - server-b
    restart: unless-stopped

  server-b:
    build: ./server-b
    ports:
      - "3001:3001"
    environment:
      DB_PATH: /data/adoptions.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data: